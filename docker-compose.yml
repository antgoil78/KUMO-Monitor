services:
  kumo-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
        IMAGE_VERSION: ${KUMO_IMAGE_VERSION:-latest}
    image: kumo-monitor:${KUMO_IMAGE_VERSION:-latest}
    container_name: kumo-monitor
    ports:
      - "5000:5000"
    environment:
      KUMO_USE_MOCK: ${KUMO_USE_MOCK:-false}
      KUMO_IMAGE_VERSION: ${KUMO_IMAGE_VERSION:-latest}
      KUMO_REFRESH_SECONDS: ${KUMO_REFRESH_SECONDS:-5}
      KUMO_SHARED_LOCK_SYNC_SECONDS: ${KUMO_SHARED_LOCK_SYNC_SECONDS:-1}
      KUMO_DASHBOARD_CACHE_SECONDS: ${KUMO_DASHBOARD_CACHE_SECONDS:-30}
      KUMO_SESSION_CACHE_SECONDS: ${KUMO_SESSION_CACHE_SECONDS:-300}
      KUMO_ACTIVITY_LEASE_SECONDS: ${KUMO_ACTIVITY_LEASE_SECONDS:-90}
      KUMO_LOOKUP_USER_PROFILE: ${KUMO_LOOKUP_USER_PROFILE:-false}
      SNOWFLAKE_LOGIN_TIMEOUT_SECONDS: ${SNOWFLAKE_LOGIN_TIMEOUT_SECONDS:-15}
      SNOWFLAKE_NETWORK_TIMEOUT_SECONDS: ${SNOWFLAKE_NETWORK_TIMEOUT_SECONDS:-45}
      SNOWFLAKE_SOCKET_TIMEOUT_SECONDS: ${SNOWFLAKE_SOCKET_TIMEOUT_SECONDS:-30}
      SNOWFLAKE_STATEMENT_TIMEOUT_SECONDS: ${SNOWFLAKE_STATEMENT_TIMEOUT_SECONDS:-1200}
      KUMO_ENV: ${KUMO_ENV:-}
      KUMO_DEPLOYMENT_ENV: ${KUMO_DEPLOYMENT_ENV:-}
      KUMO_DB: ${KUMO_DB:-}
      KUMO_SCHEMA: ${KUMO_SCHEMA:-}
      KUMO_METADATA_SCHEMA: ${KUMO_METADATA_SCHEMA:-}
      KUMO_MODEL_PROGRESS_TABLE: ${KUMO_MODEL_PROGRESS_TABLE:-}
      KUMO_TEST_PROGRESS_TABLE: ${KUMO_TEST_PROGRESS_TABLE:-}
      KUMO_RUN_LOG_TABLE: ${KUMO_RUN_LOG_TABLE:-}
      KUMO_RULE_VERIFY_PROCEDURE: ${KUMO_RULE_VERIFY_PROCEDURE:-}
      KUMO_LIM_DATABASE: ${KUMO_LIM_DATABASE:-}
      KUMO_ORCHESTRATION_SCHEMA: ${KUMO_ORCHESTRATION_SCHEMA:-}
      KUMO_PROGRESS_TABLE: ${KUMO_PROGRESS_TABLE:-}
      KUMO_WORKFLOW_DEP_RULE_TABLE: ${KUMO_WORKFLOW_DEP_RULE_TABLE:-}
      KUMO_MODEL_STATUS_TABLE: ${KUMO_MODEL_STATUS_TABLE:-}
      KUMO_WORKFLOW_STATUS_TABLE: ${KUMO_WORKFLOW_STATUS_TABLE:-}
      KUMO_LIM_STAGE: ${KUMO_LIM_STAGE:-}
      KUMO_LIM_LOAD_PROCEDURE: ${KUMO_LIM_LOAD_PROCEDURE:-}
      KUMO_LIM_ROLE: ${KUMO_LIM_ROLE:-KUMO_ADMIN}
      KUMO_TASK_WAREHOUSE: ${KUMO_TASK_WAREHOUSE:-KUMO_ELT_GEN_1}
      KUMO_AUTO_RESUME_TASKS: ${KUMO_AUTO_RESUME_TASKS:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_PASSCODE: ${SNOWFLAKE_PASSCODE:-}
      SNOWFLAKE_PASSCODE_IN_PASSWORD: ${SNOWFLAKE_PASSCODE_IN_PASSWORD:-false}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-}
    restart: unless-stopped
