services:
  kumo-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: kumo-monitor:latest
    container_name: kumo-monitor
    ports:
      - "5000:5000"
    environment:
      KUMO_USE_MOCK: ${KUMO_USE_MOCK:-false}
      KUMO_REFRESH_SECONDS: ${KUMO_REFRESH_SECONDS:-30}
      KUMO_SHARED_LOCK_SYNC_SECONDS: ${KUMO_SHARED_LOCK_SYNC_SECONDS:-30}
      KUMO_DASHBOARD_CACHE_SECONDS: ${KUMO_DASHBOARD_CACHE_SECONDS:-30}
      KUMO_SESSION_CACHE_SECONDS: ${KUMO_SESSION_CACHE_SECONDS:-300}
      KUMO_ACTIVITY_LEASE_SECONDS: ${KUMO_ACTIVITY_LEASE_SECONDS:-90}
      KUMO_LOOKUP_USER_PROFILE: ${KUMO_LOOKUP_USER_PROFILE:-false}
      SNOWFLAKE_LOGIN_TIMEOUT_SECONDS: ${SNOWFLAKE_LOGIN_TIMEOUT_SECONDS:-15}
      SNOWFLAKE_NETWORK_TIMEOUT_SECONDS: ${SNOWFLAKE_NETWORK_TIMEOUT_SECONDS:-45}
      SNOWFLAKE_SOCKET_TIMEOUT_SECONDS: ${SNOWFLAKE_SOCKET_TIMEOUT_SECONDS:-30}
      SNOWFLAKE_STATEMENT_TIMEOUT_SECONDS: ${SNOWFLAKE_STATEMENT_TIMEOUT_SECONDS:-45}
      KUMO_DB: ${KUMO_DB:-KUMO_ADMIN}
      KUMO_SCHEMA: ${KUMO_SCHEMA:-WORKFLOW_MANAGER}
      KUMO_PROGRESS_TABLE: ${KUMO_PROGRESS_TABLE:-KUMO_TST.META.EXECUTION_PROGRESS}
      KUMO_EXECUTION_RESULT_TABLE: ${KUMO_EXECUTION_RESULT_TABLE:-KUMO_TST.META.EXECUTION_RESULT}
      KUMO_RUN_LOG_TABLE: ${KUMO_RUN_LOG_TABLE:-KUMO_TST.META.RUN_LOG}
      KUMO_LIM_DATABASE: ${KUMO_LIM_DATABASE:-KUMO_TST}
      KUMO_LIM_ROLE: ${KUMO_LIM_ROLE:-KUMO_ADMIN}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_PASSCODE: ${SNOWFLAKE_PASSCODE:-}
      SNOWFLAKE_PASSCODE_IN_PASSWORD: ${SNOWFLAKE_PASSCODE_IN_PASSWORD:-false}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-KUMO_ADMIN}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-WORKFLOW_MANAGER}
    restart: unless-stopped
