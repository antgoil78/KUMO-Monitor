name: Build and Push KUMO Monitor Container

# Deployment verification: each main push publishes a fresh versioned image.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SNOWFLAKE_REGISTRY: ${{ vars.SNOWFLAKE_REGISTRY || 'vymkbmw-ov24823.registry.snowflakecomputing.com' }}
  KUMO_IMAGE_REPOSITORY: ${{ vars.KUMO_IMAGE_REPOSITORY }}
  LEGACY_IMAGE_URI: ${{ vars.KUMO_IMAGE_URI }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare versioned image
        shell: bash
        run: |
          image_repository="${KUMO_IMAGE_REPOSITORY:-${LEGACY_IMAGE_URI:-${SNOWFLAKE_REGISTRY}/kumo_shared/monitor_app/monitor_repository/kumo-monitor}}"
          # Keep existing repository overrides, but always generate a fresh tag.
          if [[ "${image_repository##*/}" == *:* ]]; then
            image_repository="${image_repository%:*}"
          fi
          if [[ ! "$image_repository" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9_.-]+/[a-z0-9_.-]+/[a-z0-9_.-]+/[a-z0-9_.-]+$ ]]; then
            echo "::error::Image repository must be registry/database/schema/repository/image without a digest."
            exit 1
          fi
          if [[ "${image_repository%%/*}" != "$SNOWFLAKE_REGISTRY" ]]; then
            echo "::error::Image repository hostname must match SNOWFLAKE_REGISTRY."
            exit 1
          fi
          image_version="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          printf '%s\n' \
            "IMAGE_VERSION=${image_version}" \
            "IMAGE_URI=${image_repository}:${image_version}" \
            "SPCS_IMAGE_PATH=/${image_repository#*/}:${image_version}" >> "$GITHUB_ENV"

      - name: Show repository structure
        run: |
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Validate backend Python files
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import traceback
          import sys

          failed = False
          null_byte = bytes([0])

          for path in sorted(Path("backend").rglob("*.py")):
              data = path.read_bytes()

              if null_byte in data:
                  print("NULL BYTE FOUND:", path)
                  print("Null byte count:", data.count(null_byte))
                  print("First null byte at position:", data.index(null_byte))
                  failed = True
                  continue

              try:
                  py_compile.compile(str(path), doraise=True)
                  print("OK:", path)
              except Exception:
                  print("FAILED:", path)
                  traceback.print_exc()
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Snowflake registry
        run: |
          echo "${{ secrets.SNOWFLAKE_PASSWORD }}" | docker login "${SNOWFLAKE_REGISTRY}" \
            -u "${{ secrets.SNOWFLAKE_USER }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "IMAGE_VERSION=${IMAGE_VERSION}" \
            -t "${IMAGE_URI}" .

      - name: Push Docker image to Snowflake
        run: |
          docker push "${IMAGE_URI}"

      - name: Summarize published version
        run: |
          echo "Published image: ${IMAGE_URI}"
          {
            echo "### Published KUMO Monitor image"
            echo
            echo "- Version: \`${IMAGE_VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Docker image: \`${IMAGE_URI}\`"
            echo "- SPCS image path: \`${SPCS_IMAGE_PATH}\`"
            echo
            echo "Use the SPCS image path in the selected DEV or TST service specification."
            echo "Existing services keep their selected version until their specification is updated."
          } >> "$GITHUB_STEP_SUMMARY"
