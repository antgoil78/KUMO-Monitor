name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: kumo_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: kumo_engine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kumo_ci -d kumo_engine_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KUMO_USE_MOCK: 'true'
      KUMO_ORCHESTRATION_RUNS_ENABLED: 'false'
      KUMO_TASK_ENGINE_TEST_DSN: postgresql://kumo_ci:isolated-ci-only@127.0.0.1:5432/kumo_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix frontend
      - name: Backend unit tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Frontend unit tests and build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests with fixture API
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
